# Docker-compose

services:
  # App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - INFLUXDB_HOST=http://influxdb:8086
      - INFLUXDB_ORG=home_org
      - INFLUXDB_BUCKET=home
      - INFLUXDB_TOKEN=hardware_info
    depends_on:
      - influxdb
    privileged: true
    restart: unless-stopped
    stop_grace_period: 5s
    volumes:
      - /proc/stat:/proc/stat:ro
      - /proc/meminfo:/proc/meminfo:ro
      - /sys/class/powercap:/sys/class/powercap:ro
      - /sys/class/drm:/sys/class/thermal:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /dev:/dev:ro

  # InfluxDB
  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=influx_admin
      - DOCKER_INFLUXDB_INIT_ORG=home_org
      - DOCKER_INFLUXDB_INIT_BUCKET=home
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=hardware_info
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards

volumes:
  influxdb_data:
